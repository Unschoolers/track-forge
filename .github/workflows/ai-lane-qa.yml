name: AI lane QA

on:
  pull_request:
    paths:
      - 'src/domain/**'
      - 'qa/lanes/**'
      - 'tests/domain/ai*.test.ts'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/ai-lane-qa.yml'
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of seeds per scenario (1–100)
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: lanes-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulate solo and traffic on all fixtures in both directions
        env:
          LANE_SEEDS: ${{ inputs.seeds || 1 }}
        run: npm run qa:lanes -- --scenario all --mode both --seeds "$LANE_SEEDS"
      - name: Upload dot trails and telemetry
        if: always()
        id: report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-lane-report
          path: qa/results/lanes/
          retention-days: 14
          if-no-files-found: error
      - name: Link report
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: printf '## AI lane checker\n\n[Download dot trails and JSON telemetry](%s).\n\nDiagnostic findings are recorded without failing this baseline workflow. Use --strict locally to gate error findings.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
