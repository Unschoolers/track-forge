name: AI optimization lab

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/domain/**'
      - 'src/application/**'
      - 'src/infrastructure/**'
      - 'src/adapters/**'
      - 'qa/lanes/**'
      - 'qa/optimization/**'
      - 'qa/race-analysis/**'
      - 'tests/fixtures/**'
      - 'src/domain/race/ai/**'
      - 'src/domain/race/raceFactory.ts'
      - 'src/domain/race/vehicleDynamics.ts'
      - 'src/domain/race/vehiclePhysicsConfig.ts'
      - 'src/domain/race/vehiclePhysics.ts'
      - 'src/domain/race/raceRecovery.ts'
      - 'src/domain/race/raceEngine.ts'
      - 'src/domain/race/arcadeTimingGate.ts'
      - 'src/domain/race/progress.ts'
      - 'tests/fixtures/desertSandAi.trackforge.json'
      - 'docs/ai-optimization.md'
      - '.github/workflows/ai-optimization.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
    # Running worker-thread studies are short but do not cancel promptly mid-trial.
  # Finish the active study; GitHub keeps only the latest pending revision.
  group: trackforge-ai-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run qa:optimize:test

  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEHAVIOR_PRESERVING: ${{ contains(github.event.pull_request.labels.*.name, 'behavior-preserving') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run four-car parallel AI optimization study
        run: |
          behavior_flags=()
          if [[ "$BEHAVIOR_PRESERVING" == true ]]; then behavior_flags+=(--behavior-preserving); fi
          npm run qa:optimize -- --workers 2 --trials 14 --seeds 1,4331 --out qa/results/optimization "${behavior_flags[@]}"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Convert study tables to Parquet (offline analysis only)
        run: |
          python3 -m pip install --quiet 'duckdb>=1.4,<2'
          python3 qa/optimization/to_parquet.py qa/results/optimization
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ai-optimization-${{ github.sha }}
          path: qa/results/optimization/
          if-no-files-found: warn
          retention-days: 14

  passing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run independent per-car passing duels and full-field validation
        run: npm run qa:optimize -- --focus passing --workers 2 --trials 14 --seeds 1,4331 --out qa/results/passing
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Export duel measurements to Parquet
        run: |
          python3 -m pip install --quiet 'duckdb>=1.4,<2'
          python3 qa/optimization/to_parquet.py qa/results/passing
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ai-passing-${{ github.sha }}
          path: qa/results/passing/
          if-no-files-found: warn
          retention-days: 14
