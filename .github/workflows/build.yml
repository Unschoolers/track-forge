name: Verify and build Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      apk_artifact_id: ${{ steps.apk.outputs.artifact-id }}
      version_code: ${{ steps.version.outputs.TRACKFORGE_VERSION_CODE }}
      version_name: ${{ steps.version.outputs.TRACKFORGE_VERSION_NAME }}
      build_run: ${{ steps.version.outputs.TRACKFORGE_BUILD_RUN }}
      build_attempt: ${{ steps.version.outputs.TRACKFORGE_BUILD_ATTEMPT }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android
      - name: Set unique Android build version
        id: version
        run: |
          node scripts/android-build-policy.mjs version "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/trackforge-version.env"
          cat "$RUNNER_TEMP/trackforge-version.env" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/trackforge-version.env" >> "$GITHUB_OUTPUT"
      - name: Assemble debug APK without the signing key
        run: cd android && ./gradlew assembleDebug
      - name: Verify unsigned APK metadata
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo 'Expected exactly one unsigned APK.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" > "$RUNNER_TEMP/trackforge-badging.txt"
          node scripts/android-build-policy.mjs metadata "$RUNNER_TEMP/trackforge-badging.txt" "$TRACKFORGE_VERSION_CODE" "$TRACKFORGE_VERSION_NAME"
          cp "${apks[0]}" trackforge-unsigned.apk
      - name: Upload unsigned build for isolated signing
        id: apk
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trackforge-unsigned-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: trackforge-unsigned.apk
          retention-days: 7
          if-no-files-found: error
      - name: Explain build artifact
        run: printf '## Android build\n\nUnsigned QA artifact verified. Installable APKs are signed and published from main in the protected android-signing environment.\n' >> "$GITHUB_STEP_SUMMARY"

  sign-and-release:
    needs: android
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: android-signing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Download verified unsigned APK
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.android.outputs.apk_artifact_id }}
          path: unsigned-apk
          merge-multiple: true
      - name: Sign with permanent identity and verify install metadata
        env:
          DEBUG_KEY_BASE64: ${{ secrets.TRACKFORGE_DEBUG_KEYSTORE_BASE64 }}
          VERSION_CODE: ${{ needs.android.outputs.version_code }}
          VERSION_NAME: ${{ needs.android.outputs.version_name }}
        run: |
          if [ -z "$DEBUG_KEY_BASE64" ]; then
            echo '::error::Configure the original TrackForge key as TRACKFORGE_DEBUG_KEYSTORE_BASE64 in the main-only android-signing environment. Refusing to create another incompatible APK.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/trackforge-signing.keystore"
          printf '%s' "$DEBUG_KEY_BASE64" | base64 --decode > "$key_file"
          actual_signer=$(keytool -exportcert -keystore "$key_file" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          expected_signer=$(tr -d '\r\n' < android/signing-certificate.sha256)
          if [ "$actual_signer" != "$expected_signer" ]; then
            echo '::error::The configured key does not match the pinned TrackForge certificate.'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$key_file" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out trackforge-debug.apk unsigned-apk/trackforge-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs trackforge-debug.apk > "$RUNNER_TEMP/trackforge-certificates.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging trackforge-debug.apk > "$RUNNER_TEMP/trackforge-badging.txt"
          node scripts/android-build-policy.mjs verify "$RUNNER_TEMP/trackforge-badging.txt" "$RUNNER_TEMP/trackforge-certificates.txt" "$VERSION_CODE" "$VERSION_NAME"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/trackforge-signing.keystore"
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.android.outputs.version_code }}
          VERSION_NAME: ${{ needs.android.outputs.version_name }}
          BUILD_RUN: ${{ needs.android.outputs.build_run }}
          BUILD_ATTEMPT: ${{ needs.android.outputs.build_attempt }}
        run: |
          tag="android-build-${BUILD_RUN}-${BUILD_ATTEMPT}"
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > releases.json
          highest_build=$(jq -r '[.[][] | select(.draft == false) | .tag_name | capture("^android-build-(?<run>[0-9]+)-[0-9]+$")? | .run | tonumber] | max // 0' releases.json)
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          latest=(--latest=false)
          if (( BUILD_RUN >= highest_build )) && [ "$GITHUB_SHA" = "$main_sha" ]; then
            latest=(--latest)
          fi
          if gh release view "$tag" --repo "$GH_REPO" --json targetCommitish,assets > existing-release.json 2>/dev/null; then
            if [ "$(jq -r '.targetCommitish' existing-release.json)" != "$GITHUB_SHA" ]; then
              echo 'Existing release has a different source commit; refusing replacement.' >&2
              exit 1
            fi
            if ! jq -e '.assets[] | select(.name == "trackforge-debug.apk")' existing-release.json > /dev/null; then
              gh release upload "$tag" trackforge-debug.apk --repo "$GH_REPO"
            fi
          else
            printf 'TrackForge %s (Android version code %s).\n\nSigned with the fixed original TrackForge certificate.\n\nCommit: `%s`.\n\nVerified build: %s/%s/actions/runs/%s\n' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
            gh release create "$tag" trackforge-debug.apk --repo "$GH_REPO" --target "$GITHUB_SHA" --title "TrackForge Android ${VERSION_NAME}" --notes-file release-notes.md "${latest[@]}"
          fi
          printf '## APK release\n\nVersion %s (code %s).\n\n[Download this APK](%s/%s/releases/download/%s/trackforge-debug.apk)\n' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
