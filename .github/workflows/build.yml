name: Verify and build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.changes.outputs.native }}
      release: ${{ steps.changes.outputs.release }}
      web_artifact_id: ${{ steps.web-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Determine whether native verification is required
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Multi-commit main pushes can exceed the shallow checkout. Retrieve
          # the exact previous revision before deciding whether to publish.
          if [[ "$EVENT_NAME" == push && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/android-ci-native-required.mjs >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Set web build release identity
        id: version
        run: |
          node scripts/android-build-policy.mjs version "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/trackforge-version.env"
          cat "$RUNNER_TEMP/trackforge-version.env" >> "$GITHUB_OUTPUT"
      - name: Build web assets with embedded release identity
        run: npm run build
        env:
          VITE_TRACKFORGE_BUILD_RUN: ${{ steps.version.outputs.TRACKFORGE_BUILD_RUN }}
          VITE_TRACKFORGE_BUILD_ATTEMPT: ${{ steps.version.outputs.TRACKFORGE_BUILD_ATTEMPT }}
      - uses: actions/upload-artifact@v7.0.2
        if: steps.changes.outputs.native != 'false'
        id: web-artifact
        with:
          name: web-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:race:test
      - run: npm run test:fast -- --maxWorkers=4
      - run: npm run lint

  # Required deterministic AI physics regression, isolated from fast test workers.
  ai-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ai:matrix

  android:
    needs: web-build
    if: needs.web-build.outputs.native != 'false'
    runs-on: ubuntu-latest
    outputs:
      apk_artifact_id: ${{ steps.apk.outputs.artifact-id }}
      version_code: ${{ steps.version.outputs.TRACKFORGE_VERSION_CODE }}
      version_name: ${{ steps.version.outputs.TRACKFORGE_VERSION_NAME }}
      build_run: ${{ steps.version.outputs.TRACKFORGE_BUILD_RUN }}
      build_attempt: ${{ steps.version.outputs.TRACKFORGE_BUILD_ATTEMPT }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle') }}
      - name: Ensure Android SDK 36
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.web-build.outputs.web_artifact_id }}
          path: dist
          merge-multiple: true
      - run: npx cap sync android
      - name: Set unique Android build version
        id: version
        run: |
          node scripts/android-build-policy.mjs version "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/trackforge-version.env"
          cat "$RUNNER_TEMP/trackforge-version.env" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/trackforge-version.env" >> "$GITHUB_OUTPUT"
      - name: Test native Android behavior and assemble unsigned APK
        run: cd android && ./gradlew testDebugUnitTest assembleDebug --build-cache
      - name: Verify unsigned APK metadata
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo 'Expected exactly one unsigned APK.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" > "$RUNNER_TEMP/trackforge-badging.txt"
          node scripts/android-build-policy.mjs metadata "$RUNNER_TEMP/trackforge-badging.txt" "$TRACKFORGE_VERSION_CODE" "$TRACKFORGE_VERSION_NAME"
          cp "${apks[0]}" trackforge-unsigned.apk
      - name: Upload unsigned build for isolated signing
        id: apk
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trackforge-unsigned-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: trackforge-unsigned.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Explain build artifact
        run: printf '## Android build\n\nUnsigned QA artifact verified. Installable APKs are signed and published from main in the protected android-signing environment.\n' >> "$GITHUB_STEP_SUMMARY"


  windows:
    needs: web-build
    if: needs.web-build.outputs.native != 'false'
    runs-on: windows-latest
    outputs:
      exe_artifact_id: ${{ steps.exe.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.web-build.outputs.web_artifact_id }}
          path: dist
          merge-multiple: true
      - name: Test Windows LAN handshake and native contracts
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --bin trackforge
      - name: Compile portable Windows application with embedded game assets
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
      - name: Validate and stage standalone Windows executable
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/trackforge.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Windows executable was not produced" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "Windows executable is unexpectedly small" }
          $magic = Get-Content -Path $exe -AsByteStream -TotalCount 2
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "Windows executable is not a PE file" }
          Copy-Item $exe TrackForge.exe
      - name: Upload portable Windows executable
        id: exe
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trackforge-windows-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: TrackForge.exe
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  sign-and-release:
    needs: [web-build, android, verify, windows, ai-matrix]
    if: github.ref == 'refs/heads/main' && needs.web-build.outputs.release == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: android-signing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android signing tools
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            sdkmanager 'build-tools;36.0.0'
          fi
      - name: Download verified unsigned APK
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.android.outputs.apk_artifact_id }}
          path: unsigned-apk
          merge-multiple: true
      - name: Download verified Windows executable
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.exe_artifact_id }}
          path: windows-exe
          merge-multiple: true
      - name: Sign with permanent identity and verify install metadata
        env:
          DEBUG_KEY_BASE64: ${{ secrets.TRACKFORGE_DEBUG_KEYSTORE_BASE64 }}
          VERSION_CODE: ${{ needs.android.outputs.version_code }}
          VERSION_NAME: ${{ needs.android.outputs.version_name }}
        run: |
          if [ -z "$DEBUG_KEY_BASE64" ]; then
            echo '::error::Configure the original TrackForge key as TRACKFORGE_DEBUG_KEYSTORE_BASE64 in the main-only android-signing environment. Refusing to create another incompatible APK.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/trackforge-signing.keystore"
          printf '%s' "$DEBUG_KEY_BASE64" | base64 --decode > "$key_file"
          actual_signer=$(keytool -exportcert -keystore "$key_file" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          expected_signer=$(tr -d '\r\n' < android/signing-certificate.sha256)
          if [ "$actual_signer" != "$expected_signer" ]; then
            echo '::error::The configured key does not match the pinned TrackForge certificate.'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$key_file" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out trackforge-debug.apk unsigned-apk/trackforge-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs trackforge-debug.apk > "$RUNNER_TEMP/trackforge-certificates.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging trackforge-debug.apk > "$RUNNER_TEMP/trackforge-badging.txt"
          node scripts/android-build-policy.mjs verify "$RUNNER_TEMP/trackforge-badging.txt" "$RUNNER_TEMP/trackforge-certificates.txt" "$VERSION_CODE" "$VERSION_NAME"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/trackforge-signing.keystore"
      - name: Publish Android APK and portable Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.android.outputs.version_code }}
          VERSION_NAME: ${{ needs.android.outputs.version_name }}
          BUILD_RUN: ${{ needs.android.outputs.build_run }}
          BUILD_ATTEMPT: ${{ needs.android.outputs.build_attempt }}
        run: |
          tag="android-build-${BUILD_RUN}-${BUILD_ATTEMPT}"
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > releases.json
          highest_build=$(jq -r '[.[][] | select(.draft == false) | .tag_name | capture("^android-build-(?<run>[0-9]+)-[0-9]+$")? | .run | tonumber] | max // 0' releases.json)
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          latest=(--latest=false)
          if (( BUILD_RUN >= highest_build )) && [ "$GITHUB_SHA" = "$main_sha" ]; then
            latest=(--latest)
          fi
          if gh release view "$tag" --repo "$GH_REPO" --json targetCommitish,assets > existing-release.json 2>/dev/null; then
            if [ "$(jq -r '.targetCommitish' existing-release.json)" != "$GITHUB_SHA" ]; then
              echo 'Existing release has a different source commit; refusing replacement.' >&2
              exit 1
            fi
            if ! jq -e '.assets[] | select(.name == "trackforge-debug.apk")' existing-release.json > /dev/null; then
              gh release upload "$tag" trackforge-debug.apk --repo "$GH_REPO"
            fi
            if ! jq -e '.assets[] | select(.name == "TrackForge.exe")' existing-release.json > /dev/null; then
              gh release upload "$tag" windows-exe/TrackForge.exe --repo "$GH_REPO"
            fi
          else
            # Notes are calculated from the previous published APK, not the last commit.
            # Conditional Android builds can skip web-only commits or several releases.
            previous_tag=$(jq -r --argjson run "$BUILD_RUN" --argjson attempt "$BUILD_ATTEMPT" '
              [.[][] | select(.draft == false) | .tag_name as $tag
                | ($tag | capture("^android-build-(?<run>[0-9]+)-(?<attempt>[0-9]+)$")?) as $v
                | select($v != null)
                | {tag: $tag, run: ($v.run | tonumber), attempt: ($v.attempt | tonumber)}
                | select(.run < $run or (.run == $run and .attempt < $attempt))]
              | sort_by(.run, .attempt) | last | .tag // empty
            ' releases.json)
            if [ -n "$previous_tag" ]; then
              for attempt in 1 2 3; do
                if gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
                  -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
                  -f previous_tag_name="$previous_tag" --jq '.body' > generated-notes.md; then
                  break
                fi
                if (( attempt == 3 )); then
                  echo 'GitHub release-notes API failed after three attempts.' >&2
                  exit 1
                fi
                sleep "$((attempt * 3))"
              done
            else
              printf "## What's Changed\n\nFirst published Android build.\n" > generated-notes.md
            fi
            {
              cat generated-notes.md
              printf '\n### Build details\n\nTrackForge %s (Android version code %s).\n\n' "$VERSION_NAME" "$VERSION_CODE"
              printf 'Android APK is signed with the fixed original TrackForge certificate. Windows portable EXE is unsigned and requires WebView2. Nearby LAN multiplayer supports Windows and Android on the same local network; Android Nearby wireless mode is still available.\n\nCommit: `%s`.\n\nVerified build: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > release-notes.md
            for attempt in 1 2 3; do
              if gh release create "$tag" trackforge-debug.apk windows-exe/TrackForge.exe --repo "$GH_REPO" --target "$GITHUB_SHA" --title "TrackForge ${VERSION_NAME}" --notes-file release-notes.md "${latest[@]}"; then
                break
              fi
              # A 502 can happen after GitHub committed the release. Confirm both assets
              # before treating it as success; partial releases remain a hard failure.
              if gh release view "$tag" --repo "$GH_REPO" --json targetCommitish,assets > recovered-release.json 2>/dev/null; then
                if [ "$(jq -r '.targetCommitish' recovered-release.json)" = "$GITHUB_SHA" ] &&
                   jq -e '([.assets[].name] | index("trackforge-debug.apk") != null and index("TrackForge.exe") != null)' recovered-release.json > /dev/null; then
                  echo "GitHub release exists with both verified artifacts after a retryable API error."
                  break
                fi
                echo 'GitHub created an incomplete or mismatched release; rerun signing/publication to recover.' >&2
                exit 1
              fi
              if (( attempt == 3 )); then
                echo 'GitHub release creation failed after three attempts.' >&2
                exit 1
              fi
              sleep "$((attempt * 3))"
            done
          fi
          printf '## Android + Windows release\n\nVersion %s (Android code %s).\n\n[Download Android APK](%s/%s/releases/download/%s/trackforge-debug.apk)\n' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
          printf '[Download Windows EXE](%s/%s/releases/download/%s/TrackForge.exe)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
