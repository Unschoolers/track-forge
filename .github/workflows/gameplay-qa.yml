name: Mobile gameplay QA

on:
  pull_request:
    paths:
      - 'src/**'
      - 'qa/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'trackforge.html'
      - 'vite.config.ts'
      - 'playwright.mobile.config.mjs'
      - 'playwright.production.config.mjs'
      - '.github/workflows/gameplay-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameplay-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Chromium headless shell
        run: npx playwright install chromium --only-shell
      - name: Simulate mobile gameplay
        run: |
          node qa/browser/shard-list.mjs ${{ matrix.shard }} 4 /tmp/mobile-tests.txt
          npm run qa:mobile -- --test-list=/tmp/mobile-tests.txt
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: mobile-gameplay-qa-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Chromium headless shell
        run: npx playwright install chromium --only-shell
      - name: Start a race from the production build
        run: npm run qa:mobile:production
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: mobile-gameplay-qa-${{ github.run_id }}-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
