name: Issue 270 Hard AI branch QA

on:
  push:
    branches:
      - fix/270-hard-ai-tuning

permissions:
  contents: read

concurrency:
  group: issue-270-hard-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Race analysis unit checks
        run: npm run qa:race:test
      - name: Typed analyzer and AI compilation
        run: npm run typecheck
      - name: Exported-track simulation smoke test
        run: npm run qa:race -- simulate tests/fixtures/kidsRoomAi.trackforge.json --car blue --mode solo --difficulty hard --seed 1 --laps 2 --seconds 120
      - name: Kids Room all cars and difficulties, plus Pine and policy regressions
        run: npx vitest run tests/domain/kidsRoomAiBenchmark.test.ts tests/domain/kidsRoomAiPace.test.ts tests/domain/aiHardPace.test.ts tests/domain/aiDifficultyPolicy.test.ts --reporter=verbose
      - name: Diagnostic car-specific Hard profile sweep
        env:
          AI_PROFILE_SWEEP: '1'
        run: npx vitest run tests/domain/aiHardProfileSweep.test.ts --reporter=verbose
      - name: Roundabout Blue traffic and recovery diagnostic
        env:
          AI_ROUNDABOUT_SWEEP: '1'
        run: npx vitest run tests/domain/roundaboutDiagnostic.test.ts --reporter=verbose
      - name: All domain regression tests
        run: npx vitest run tests/domain --maxWorkers=4
      - name: Lane checker
        run: npm run qa:lanes -- --scenario all --mode both --seeds 1 --fail-on-regressions
